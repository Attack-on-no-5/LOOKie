spring.application.name=backend

# ==========================================
# 1. MyBatis Configuration
# ==========================================
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=lookie.backend.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ==========================================
# 2. Database Configuration (MySQL)
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/lookie?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false
spring.datasource.username=lookie
spring.datasource.password=lookie123

# ==========================================
# 3. JWT Configuration
# ==========================================
# Secret Key (Fallback provided for local dev)
jwt.secret=${JWT_SECRET:LocalDevSecretKeyMustBe32CharsLong}

# Access Token Expiration: 1 Hour (3600000 ms)
jwt.expiration=${JWT_EXPIRATION:3600000} 

# Refresh Token Expiration: 14 Days (1209600000 ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# ==========================================
# 4. CORS Configuration
# ==========================================
# Allowed Origins (Default: * for local dev, specific domain for prod)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==========================================
# 5. Flyway Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true

# ==========================================
# 6. Redis Configuration
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# 7. Mail Configuration (SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 8. LiveKit Configuration
# ==========================================
livekit.url=${LIVEKIT_URL:wss://lookie-of5j44vq.livekit.cloud}
livekit.api-key=${LIVEKIT_API_KEY:dev-key}       
livekit.api-secret=${LIVEKIT_API_SECRET:dev-secret}

# ==========================================
# 9. AI Server Configuration
# ==========================================
ai.server.url=${AI_SERVER_URL:http://localhost:8000}
# AI 클라이언트 RestTemplate 타임아웃 (AI 서버 지연 시 무한 대기 방지)
ai.client.connect-timeout=3s
ai.client.read-timeout=5s

control.bottleneck-threshold=120
# 구역 상태(NORMAL/STABLE) 판정 SLA gap 임계값(분) — 기존 하드코딩 30 외부화
control.zone-status-threshold-minutes=30

# ==========================================
# 10. File Upload Configuration
# ==========================================
# Local Development Default (Relative path inside project)
file.upload-dir=./uploads
file.base-url=http://localhost:8080/images

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# 11. Observability (Phase 0 - Prometheus/Micrometer)
# ==========================================
# Spring Boot 3.2.2 기준: exposure.include 로 /actuator/prometheus 노출 (enabled 기본 true).
# actuator 접근 허용은 SecurityConfig의 permitAll("/actuator/**")로 처리.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=lookie
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
